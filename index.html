<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRFBB HDF — Réunions</title>
<style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #e63946;
  --blue: #3b82f6;
  --text: #1e293b;
  --muted: #64748b;
  --border: #e2e8f0;
  --surface: #f8fafc;
  --white: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body { font-family: var(--font); color: var(--text); background: var(--surface); min-height: 100vh; }
button { font-family: var(--font); cursor: pointer; }
textarea, input, select { font-family: var(--font); }

/* ── HEADER ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: var(--white); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100; gap: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.logo-text { font-size: 15px; font-weight: 800; color: var(--text); }
.logo-text span { color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav-btn { padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); font-size: 13px; font-weight: 500; color: var(--muted); transition: all .15s; white-space: nowrap; }
.nav-btn:hover { background: var(--surface); color: var(--text); }
.nav-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 8px; }
.save-ok { font-size: 12px; color: #22c55e; font-weight: 600; opacity: 0; transition: opacity .3s; }

/* ── BOUTONS ── */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { opacity: .9; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface); }
.btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
.btn-danger:hover { background: #fca5a5; }

/* ── TABS ── */
.tab { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
.tab.active { display: block; }

/* ── CARDS ── */
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ── TIMER ── */
.timer-wrap { background: #1a202c; color: white; padding: 14px 18px; }
.timer-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.timer-clock { font-size: 36px; font-weight: 800; font-family: monospace; letter-spacing: 2px; flex-shrink: 0; }
.timer-clock.warn { color: #f59e0b; }
.timer-clock.danger { color: var(--accent); }
.timer-bar-wrap { flex: 1; }
.timer-bar-track { height: 7px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; display: flex; }
.timer-bar-track div { height: 100%; }
.timer-cursor-wrap { position: relative; height: 12px; }
.timer-cursor { position: absolute; top: -5px; width: 14px; height: 14px; background: white; border-radius: 50%; transform: translateX(-50%); left: 0%; transition: left .5s; box-shadow: 0 0 5px rgba(0,0,0,.4); }
.timer-cursor::after { content: ''; position: absolute; inset: 3px; background: var(--accent); border-radius: 50%; }
.timer-marks { display: flex; justify-content: space-between; font-size: 9px; opacity: .35; margin-top: 3px; }
.timer-quarts { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 10px; }
.quart { border-radius: 8px; padding: 7px 8px; background: rgba(255,255,255,.06); border: 1.5px solid transparent; cursor: pointer; transition: all .2s; user-select: none; }
.quart:hover { background: rgba(255,255,255,.12); }
.quart.active { border-color: var(--accent); background: rgba(230,57,70,.15); }
.quart.done { border-color: #22c55e; background: rgba(34,197,94,.1); opacity: .75; }
.quart-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
.quart-num { font-size: 10px; font-weight: 800; letter-spacing: 1px; opacity: .4; }
.quart-num.active { opacity: 1; color: var(--accent); }
.quart-num.done { opacity: 1; color: #22c55e; }
.quart-icon { font-size: 18px; margin-bottom: 2px; }
.quart-range { font-size: 10px; font-weight: 700; margin-bottom: 1px; }
.quart-label { font-size: 9px; opacity: .65; line-height: 1.3; }
.quart-saved { font-size: 9px; font-weight: 700; margin-top: 2px; min-height: 12px; }
.timer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.timer-btns { display: flex; gap: 6px; }
.t-btn { padding: 7px 14px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; }
.t-btn-play { background: #22c55e; color: white; }
.t-btn-reset { background: rgba(255,255,255,.12); color: white; }
.capitaine-block { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 6px 10px; }
.capitaine-label { font-size: 9px; opacity: .5; text-transform: uppercase; letter-spacing: .5px; }
.capitaine-name { font-size: 13px; font-weight: 700; }
.cap-select { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: white; border-radius: 6px; padding: 4px 8px; font-size: 12px; }
.cap-select option { background: #1a202c; }

/* ── ODJ ── */
.odj-wrap { padding: 0 16px 8px; }
.sdj-block { background: #f0f9ff; border: 1.5px solid #38bdf8; border-radius: 10px; margin: 10px 0; padding: 12px; }
.sdj-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #0369a1; margin-bottom: 10px; }
.prio-block { background: #fffbeb; border: 1.5px solid #f59e0b; border-radius: 10px; margin: 10px 0; padding: 10px 12px; }
.prio-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #d97706; margin-bottom: 8px; }
.theme-hdr { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; border-left: 3px solid; margin: 10px 0 6px; }
.theme-hdr-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.theme-hdr-count { font-size: 11px; opacity: .6; }

/* ── SUJET ACCORDÉON ── */
.subj { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 5px; overflow: hidden; transition: border-color .15s; }
.subj:hover { border-color: #94a3b8; }
.subj.prio { border-left: 3px solid var(--accent); }
.subj.reported { border-left: 3px solid #f59e0b; }
.subj.done-s { opacity: .6; }
.subj-hdr { display: flex; align-items: center; gap: 7px; padding: 8px 10px; cursor: pointer; background: var(--white); user-select: none; }
.subj-hdr:hover { background: #fafbfc; }
.star-btn { background: none; border: none; font-size: 15px; color: #e2e8f0; cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0; transition: transform .15s; }
.star-btn:hover { transform: scale(1.2); }
.star-btn.on { color: #f59e0b; }
.status-btn { border: none; border-radius: 20px; padding: 3px 9px; font-size: 10px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.st-todo { background: #f1f5f9; color: #64748b; }
.st-done { background: #dcfce7; color: #16a34a; }
.st-report { background: #fef3c7; color: #d97706; }
.subj-title { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.4; }
.subj-title.crossed { text-decoration: line-through; color: var(--muted); }
.chevron { font-size: 10px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }
.subj-body { display: none; padding: 10px 12px 12px; background: #fafbfc; border-top: 1px solid var(--border); }
.subj-body.open { display: block; }
.body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.body-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 5px; }
.body-ta { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; font-size: 13px; resize: vertical; min-height: 60px; background: var(--white); transition: border-color .15s; outline: none; }
.body-ta:focus { border-color: var(--blue); }

/* ── ACTIONS ── */
.actions-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
.action-row { display: flex; align-items: center; gap: 6px; background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.action-av { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: white; }
.action-txt { flex: 1; font-size: 12px; }
.action-del { background: none; border: none; color: #cbd5e1; font-size: 13px; padding: 0 2px; cursor: pointer; }
.action-del:hover { color: var(--accent); }
.add-action-btn { width: 100%; padding: 5px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
.add-action-btn:hover { background: var(--white); border-color: #94a3b8; color: var(--text); }
.aaf { background: #eff6ff; border: 1px solid #93c5fd; border-radius: 8px; padding: 10px; display: none; flex-direction: column; gap: 6px; margin-top: 5px; }
.aaf.open { display: flex; }
.aaf select, .aaf textarea { border: 1px solid #93c5fd; border-radius: 6px; padding: 6px 8px; font-size: 12px; width: 100%; outline: none; }
.aaf-btns { display: flex; gap: 6px; }
.aaf-save { flex: 1; padding: 6px; background: var(--blue); color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }
.aaf-cancel { padding: 6px 10px; background: #f1f5f9; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }

/* ── CHECKLISTS ── */
.cr-wrap { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
.cl-block { border-radius: 9px; padding: 11px; margin-bottom: 10px; }
.cl-paul { background: #fff5f5; border: 1.5px solid #fca5a5; }
.cl-olivier { background: #f0f9ff; border: 1.5px solid #7dd3fc; }
.cl-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cl-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.cl-paul .cl-title { color: #dc2626; }
.cl-olivier .cl-title { color: #0369a1; }
.cl-copy { padding: 4px 9px; border: none; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; color: white; }
.cl-paul .cl-copy { background: #dc2626; }
.cl-olivier .cl-copy { background: #0369a1; }
.cl-items { display: flex; flex-direction: column; gap: 4px; margin-bottom: 7px; }
.cl-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--white); border-radius: 6px; border: 1px solid var(--border); }
.cl-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
.cl-item span { flex: 1; font-size: 13px; }
.cl-item-del { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 12px; }
.cl-add { display: flex; gap: 6px; }
.cl-add input { flex: 1; border: 1px dashed var(--border); border-radius: 6px; padding: 6px 9px; font-size: 13px; outline: none; }
.cl-add input:focus { border-color: var(--blue); border-style: solid; }
.cl-add-btn { padding: 6px 12px; background: rgba(0,0,0,.05); border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }

/* ── EXPORT ── */
.export-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.export-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
.export-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.export-member { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px; background: var(--white); font-size: 12px; font-weight: 600; border: 2px solid; cursor: pointer; }
.cr-export-btns { display: flex; gap: 8px; margin-top: 12px; }
.cr-btn { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.cr-btn-quick { background: #1a202c; color: white; }
.cr-result { display: none; margin-top: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid var(--border); padding: 14px; }
.cr-result.open { display: block; }
.cr-text { font-family: monospace; font-size: 12px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
.cr-copy-btn { margin-top: 10px; padding: 7px 14px; background: var(--accent); color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }

/* ── ARCHIVES ── */
.arc-item { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all .15s; }
.arc-item:hover { border-color: #94a3b8; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.arc-badge { background: var(--accent); color: white; border-radius: 8px; padding: 5px 10px; text-align: center; flex-shrink: 0; min-width: 44px; }
.arc-day { font-size: 18px; font-weight: 800; line-height: 1; }
.arc-month { font-size: 10px; font-weight: 600; opacity: .85; }
.arc-info { flex: 1; }
.arc-title { font-size: 14px; font-weight: 600; }
.arc-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.arc-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.arc-tag { font-size: 10px; padding: 2px 7px; border-radius: 8px; font-weight: 600; }

/* ── ARCHIVE DETAIL (lecture seule) ── */
.arc-detail { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.arc-detail-hdr { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.arc-detail-title { font-size: 20px; font-weight: 800; }
.arc-detail-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
.arc-section { margin-bottom: 16px; }
.arc-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
.arc-subj { padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--border); background: var(--surface); margin-bottom: 6px; }
.arc-subj.done-s { border-left-color: #22c55e; }
.arc-subj.reported { border-left-color: #f59e0b; }
.arc-subj-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.arc-subj-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
.arc-subj-actions { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
.arc-action { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; }
.arc-av { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; color: white; }

/* ── MATCH DU MOIS ── */
.match-card { background: linear-gradient(135deg,#1a202c,#2d3748); color: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.match-block { background: rgba(255,255,255,.08); border-radius: 8px; padding: 12px; }
.match-block-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .6; margin-bottom: 6px; }
.match-block textarea { width: 100%; background: transparent; border: none; color: white; font-size: 13px; font-family: var(--font); resize: vertical; min-height: 60px; outline: none; }
.match-block textarea::placeholder { opacity: .4; }

/* ── THÉMATIQUES ── */
.themes-mgr { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.themes-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.theme-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.theme-chip-del { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; line-height: 1; }
.theme-chip-edit { background: none; border: none; cursor: pointer; font-size: 11px; padding: 0; line-height: 1; }

/* ── MODALES ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--white); border-radius: 12px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 0; line-height: 1; }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
.form-input { width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 14px; outline: none; transition: border-color .15s; background: var(--white); }
.form-input:focus { border-color: var(--blue); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── AGENDA BUILDER ── */
.ab-item { display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 8px; padding: 7px 10px; border: 1px solid var(--border); margin-bottom: 5px; }
.ab-sel { border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; font-size: 11px; font-weight: 700; cursor: pointer; background: var(--white); flex-shrink: 0; max-width: 130px; }
.ab-inp { flex: 1; border: none; background: transparent; font-size: 13px; outline: none; color: var(--text); }
.ab-del { background: none; border: none; color: #cbd5e1; cursor: pointer; font-size: 15px; flex-shrink: 0; }
.ab-del:hover { color: var(--accent); }
.ab-add-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ab-add-btn { padding: 4px 10px; border-radius: 20px; border: 1.5px dashed var(--border); background: var(--white); font-size: 11px; font-weight: 600; cursor: pointer; }
.ab-add-btn:hover { border-style: solid; }

/* ── NO DATA ── */
.no-data { text-align: center; padding: 60px 20px; color: var(--muted); }
.no-data-icon { font-size: 48px; margin-bottom: 12px; }
.no-data-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }

/* ── LOADING ── */
#loadingBar { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; }
#loadingBar div { height: 3px; background: linear-gradient(90deg, var(--accent), #f97316, var(--accent)); background-size: 200%; animation: slide 1s linear infinite; }
@keyframes slide { 0%{background-position:0%} 100%{background-position:200%} }
#errorBanner { display: none; position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 300; background: #fff5f5; border: 1px solid #fca5a5; color: #dc2626; padding: 10px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.1); max-width: 500px; text-align: center; }

/* ── PRINT ── */
@media print {
  .header, .nav, .timer-wrap, .cr-wrap, .export-section, .btn, button { display: none !important; }
  .tab { display: block !important; padding: 0; }
  .card { box-shadow: none; border: 1px solid #ccc; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingBar"><div></div></div>
<div id="errorBanner"></div>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">🏀</div>
    <span class="logo-text">IRFBB <span>HDF</span></span>
  </div>
  <div class="nav">
    <button class="nav-btn active" onclick="showTab('home',this)">📅 Réunion</button>
    <button class="nav-btn" onclick="showTab('archives',this)">🗂️ Archives</button>
    <button class="nav-btn" onclick="showTab('match',this)">🏟️ Match du mois</button>
  </div>
  <div class="header-right">
    <span class="save-ok" id="saveOk">✓ Sauvegardé</span>
    <button class="btn btn-primary btn-sm" onclick="openModal('reunion')">+ Nouvelle réunion</button>
  </div>
</div>

<!-- Tab : Réunion principale -->
<div class="tab active" id="tab-home">

    </div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbxmZD5WsQgZCvdX9wC2zqnpAIRWhQAe6DRYhtOq2u7gYxuPopilYyjG1ifab3ijF3Q/exec';
const TOTAL = 3600;
const Q_BOUNDS = [0, 300, 900, 1500, 3600];
const QUARTS = [
  { q:'Q1', icon:'🗣️', range:"0-5'",  label:'Météo sentimentale' },
  { q:'Q2', icon:'🏀', range:"5-15'", label:'Sujet prio du jour ⭐' },
  { q:'Q3', icon:'⚖️', range:"15-25'",label:'Décisions & rôles' },
  { q:'Q4', icon:'🔔', range:"25-60'",label:'Sirène · Prochaine réunion' },
];
const MEMBERS = [
  { id:'alex',    name:'Alex',    color:'#e87aa0' },
  { id:'ludo',    name:'Ludo',    color:'#4f86c6' },
  { id:'remi',    name:'Rémi',    color:'#5dab6e' },
  { id:'martin',  name:'Martin',  color:'#e08c3a' },
  { id:'bastien', name:'Bastien', color:'#7b68c8' },
  { id:'antoine', name:'Antoine', color:'#f97316' },
];
const FIXED_THEMES = [
  { id:'bpjeps',        label:'BPJEPS',        color:'#3b82f6', bg:'#eff6ff' },
  { id:'bf',            label:'Brevet Fédéral', color:'#8b5cf6', bg:'#f5f3ff' },
  { id:'detb',          label:'DETB',           color:'#14b8a6', bg:'#f0fdfa' },
  { id:'arbitrage',     label:'Arbitrage',      color:'#f59e0b', bg:'#fffbeb' },
  { id:'communication', label:'Communication',  color:'#ec4899', bg:'#fdf2f8' },
  { id:'ttbb',          label:'TTBB',           color:'#e63946', bg:'#fff5f5' },
  { id:'cdssa',         label:'CDSSA',          color:'#0369a1', bg:'#f0f9ff' },
  { id:'autre',         label:'Autre',          color:'#6366f1', bg:'#eef2ff' },
];

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const state = {
  reunions: [],
  agendaNotes: {},
  match: {},
  customThemes: [],
  loading: false,
};
let _editId = null;
let _agendaItems = [];
let _timers = {};
let _saveTimers = {};

// ═══════════════════════════════════════════════════════════════
// THÉMATIQUES
// ═══════════════════════════════════════════════════════════════
function getThemes() {
  return [...FIXED_THEMES, ...state.customThemes];
}
function getTheme(id) {
  return getThemes().find(t => t.id === id) || { id, label: id, color:'#6366f1', bg:'#eef2ff' };
}
function saveCustomThemes() {
  localStorage.setItem('hdf_themes', JSON.stringify(state.customThemes));
}

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function getMember(id) { return MEMBERS.find(m => m.id === id); }
function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function jp(v, fb) { try { return v ? JSON.parse(v) : fb; } catch(e) { return fb; } }
function showSaveOk() {
  const el = document.getElementById('saveOk');
  if (!el) return;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 1500);
}
function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.innerHTML = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}
function showLoading(on) {
  state.loading = on;
  document.getElementById('loadingBar').style.display = on ? 'block' : 'none';
}
function cleanTime(t) {
  if (!t) return '';
  if (typeof t === 'string') {
    if (t.includes('1899')) { const m = t.match(/T(\d{2}):(\d{2})/); return m ? m[1]+':'+m[2] : ''; }
    return t.substring(0, 5);
  }
  if (t instanceof Date) return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  return '';
}

// Notes agenda
function getReunionNotes(rid) { return state.agendaNotes[rid] || {}; }
function getItemNote(rid, idx) {
  const notes = getReunionNotes(rid);
  const key = typeof idx === 'string' && idx.startsWith('_') ? idx : 'item_'+idx;
  return notes[key] || {};
}
function getMetaNotes(rid) {
  const n = getReunionNotes(rid);
  return {
    starred:   n._starred   || [],
    capitaine: n._capitaine || '',
    cl_paul:   n._cl_paul   || [],
    cl_olivier:n._cl_olivier|| [],
  };
}

// ═══════════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════════
async function apiCall(action, body = {}) {
  const json = JSON.stringify({ action, ...body }).replace(/%/g, '%25');
  let encoded;
  try { encoded = encodeURIComponent(json); } catch(e) { encoded = json; }
  const res = await fetch(API_URL + '?payload=' + encoded, { method:'GET', redirect:'follow' });
  const text = await res.text();
  const data = JSON.parse(text);
  if (!data.success) throw new Error(data.error || 'Erreur API');
  return data.data;
}
async function loadData() {
  showLoading(true);
  try {
    const data = await apiCall('getData');
    state.reunions    = data.reunions    || [];
    state.agendaNotes = data.agendaNotes || {};
    state.customThemes = jp(localStorage.getItem('hdf_themes'), []);
  } catch(e) { showError('Erreur de chargement : ' + e.message); }
  finally { showLoading(false); }
}
async function saveItemNote(rid, idx, patch) {
  const key = typeof idx === 'string' && idx.startsWith('_') ? idx : 'item_'+idx;
  if (!state.agendaNotes[rid]) state.agendaNotes[rid] = {};
  if (!state.agendaNotes[rid][key]) state.agendaNotes[rid][key] = {};
  Object.assign(state.agendaNotes[rid][key], patch);
  await apiCall('saveAgendaNote', { reunionId: rid, key, data: state.agendaNotes[rid][key] });
  showSaveOk();
}
async function saveMetaNotes(rid, patch) {
  if (!state.agendaNotes[rid]) state.agendaNotes[rid] = {};
  Object.assign(state.agendaNotes[rid], patch);
  await apiCall('saveMeta', { reunionId: rid, data: patch });
  showSaveOk();
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function showTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if (btn) btn.classList.add('active');
  if (tab === 'home')     renderHome();
  else if (tab === 'archives') renderArchives();
  else if (tab === 'match')    renderMatch();
}

// ═══════════════════════════════════════════════════════════════
// PAGE PRINCIPALE
// ═══════════════════════════════════════════════════════════════
function renderHome() {
  const el = document.getElementById('homeContent');
  const now = new Date(); now.setHours(0,0,0,0);
  const upcoming = state.reunions
    .filter(r => r.date && new Date(r.date) >= now)
    .sort((a,b) => new Date(a.date)-new Date(b.date));

  el.innerHTML = '';
  if (!upcoming.length) {
    el.innerHTML = `<div class="no-data">
      <div class="no-data-icon">📅</div>
      <div class="no-data-title">Aucune réunion à venir</div>
      <button class="btn btn-primary" style="margin-top:16px" onclick="openModal('reunion')">+ Nouvelle réunion</button>
    </div>`;
    return;
  }
  el.appendChild(buildReunionCard(upcoming[0]));
  if (upcoming.length > 1) {
    const next = document.createElement('div');
    next.style.cssText = 'background:white;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-top:16px';
    next.innerHTML = '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px">📅 Réunions à venir</div>' +
      upcoming.slice(1).map(r => {
        const dt = new Date(r.date);
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)">
          <div style="font-size:13px;font-weight:600;color:var(--accent);min-width:80px">${dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
          <div style="font-size:13px;flex:1">${r.title}</div>
          <button class="btn btn-ghost btn-sm" onclick="editReunion('${r.id}')">✏️</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteReunion('${r.id}')">🗑️</button>
        </div>`;
      }).join('');
    el.appendChild(next);
  }
}

// ═══════════════════════════════════════════════════════════════
// CARTE RÉUNION COMPLÈTE
// ═══════════════════════════════════════════════════════════════
function buildReunionCard(r) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'rcard-'+r.id;

  const dt = r.date ? new Date(r.date) : null;
  const notes = getReunionNotes(r.id);
  const meta = getMetaNotes(r.id);
  const starred = new Set(meta.starred);
  const capMember = getMember(meta.capitaine);
  let themeMap = {};
  try { themeMap = r.agendaThemes ? JSON.parse(r.agendaThemes) : {}; } catch(e) {}

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  const dateDiv = document.createElement('div');
  dateDiv.innerHTML = dt
    ? `<div style="font-size:26px;font-weight:800;color:var(--accent);line-height:1">${dt.getDate()}</div>
       <div style="font-size:12px;color:var(--muted)">${dt.toLocaleDateString('fr-FR',{month:'long'})}&nbsp;${dt.getFullYear()}</div>`
    : '<div style="font-size:13px;color:var(--muted)">Sans date</div>';
  const infoDiv = document.createElement('div');
  infoDiv.style.cssText = 'flex:1;margin-left:16px';
  infoDiv.innerHTML = `<div style="font-size:18px;font-weight:700;margin-bottom:3px">${r.title}</div>
    <div style="font-size:13px;color:var(--muted)">${r.time?'🕐 '+cleanTime(r.time):''}${r.location?' · 📍 '+r.location:''}</div>`;
  const actDiv = document.createElement('div');
  actDiv.style.cssText = 'display:flex;gap:6px;flex-shrink:0';
  const btnEdit = document.createElement('button');
  btnEdit.className = 'btn btn-ghost btn-sm'; btnEdit.textContent = '✏️ Modifier';
  btnEdit.addEventListener('click', () => editReunion(r.id));
  const btnDel = document.createElement('button');
  btnDel.className = 'btn btn-danger btn-sm'; btnDel.textContent = '🗑️';
  btnDel.addEventListener('click', () => deleteReunion(r.id));
  actDiv.append(btnEdit, btnDel);
  hdr.append(dateDiv, infoDiv, actDiv);
  card.appendChild(hdr);

  // Timer
  card.appendChild(buildTimer(r.id, meta));

  // ODJ
  if ((r.agenda||[]).length) {
    const odj = document.createElement('div');
    odj.className = 'odj-wrap';

    // Sujet du jour
    odj.appendChild(buildSujDuJour(r.id));

    // Prioritaires
    if (starred.size) {
      const prioItems = Array.from(starred).map(i=>({i,subj:(r.agenda||[])[i]})).filter(x=>x.subj);
      if (prioItems.length) {
        const pb = document.createElement('div');
        pb.className = 'prio-block';
        pb.innerHTML = `<div class="prio-title">⭐ Prioritaires du jour <span style="background:#f59e0b;color:white;font-size:10px;padding:2px 7px;border-radius:10px">${prioItems.length}</span></div>`;
        prioItems.forEach(({i,subj}) => pb.appendChild(buildSubjectCard(r,i,subj,notes,starred,'p')));
        odj.appendChild(pb);
      }
    }

    // Par thématique — regrouper les IDs inconnus dans "autre"
    const themes = getThemes();
    const grouped = {};
    themes.forEach(t => { grouped[t.id] = []; });
    grouped['_autre'] = [];
    (r.agenda||[]).forEach((subj,i) => {
      const tid = themeMap[i];
      const known = tid && themes.find(t=>t.id===tid);
      const bucket = known ? tid : '_autre';
      if (!grouped[bucket]) grouped[bucket] = [];
      grouped[bucket].push({subj,i});
    });

    [...themes, {id:'_autre',label:'Autre',color:'#6366f1',bg:'#eef2ff'}].forEach(t => {
      const items = grouped[t.id]||[];
      if (!items.length) return;
      const thdr = document.createElement('div');
      thdr.className = 'theme-hdr';
      thdr.style.cssText = `background:${t.bg};border-left-color:${t.color}`;
      thdr.innerHTML = `<span class="theme-hdr-label" style="color:${t.color}">${t.label}</span>
        <span class="theme-hdr-count" style="color:${t.color}">${items.length} sujet${items.length>1?'s':''}</span>`;
      odj.appendChild(thdr);
      items.forEach(({subj,i}) => odj.appendChild(buildSubjectCard(r,i,subj,notes,starred)));
    });

    card.appendChild(odj);
  }

  // CR section
  card.appendChild(buildCRSection(r, meta));

  return card;
}

// ═══════════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════════
function buildTimer(rid, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'timer-wrap';

  // Barre terrain
  wrap.innerHTML = `
    <div class="timer-top">
      <div class="timer-clock" id="tclock-${rid}">60:00</div>
      <div class="timer-bar-wrap">
        <div class="timer-bar-track">
          <div style="flex:5;background:rgba(34,197,94,.5)"></div>
          <div style="width:1px;background:rgba(255,255,255,.2)"></div>
          <div style="flex:10;background:rgba(59,130,246,.4)"></div>
          <div style="width:1px;background:rgba(255,255,255,.2)"></div>
          <div style="flex:10;background:rgba(245,158,11,.35)"></div>
          <div style="width:1px;background:rgba(255,255,255,.2)"></div>
          <div style="flex:35;background:rgba(230,57,70,.3)"></div>
        </div>
        <div class="timer-cursor-wrap">
          <div class="timer-cursor" id="tlc-${rid}"></div>
        </div>
        <div class="timer-marks"><span>0'</span><span>5'</span><span>15'</span><span>25'</span><span>60'</span></div>
      </div>
    </div>`;

  // Q blocs
  const qGrid = document.createElement('div');
  qGrid.className = 'timer-quarts';
  QUARTS.forEach((q,i) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'quart'; qDiv.id = `quart-${rid}-${i}`;
    qDiv.innerHTML = `
      <div class="quart-top">
        <span class="quart-num" id="ql-${rid}-${i}">${q.q}</span>
        <span class="quart-saved" id="qs-${rid}-${i}"></span>
      </div>
      <div class="quart-icon">${q.icon}</div>
      <div class="quart-range">${q.range}</div>
      <div class="quart-label">${q.label}</div>`;
    qDiv.addEventListener('click', () => jumpToQuart(rid, i));
    qGrid.appendChild(qDiv);
  });
  wrap.appendChild(qGrid);

  // Boutons + capitaine
  const bottom = document.createElement('div');
  bottom.className = 'timer-bottom';
  const btns = document.createElement('div');
  btns.className = 'timer-btns';
  const btnPlay = document.createElement('button');
  btnPlay.className = 't-btn t-btn-play'; btnPlay.id = `tbtn-${rid}`; btnPlay.textContent = '▶ Démarrer';
  btnPlay.addEventListener('click', () => toggleTimer(rid));
  const btnReset = document.createElement('button');
  btnReset.className = 't-btn t-btn-reset'; btnReset.textContent = '↺';
  btnReset.addEventListener('click', () => resetTimer(rid));
  btns.append(btnPlay, btnReset);

  const capBlock = document.createElement('div');
  capBlock.className = 'capitaine-block';
  const capInfo = document.createElement('div');
  const capMember = getMember(meta.capitaine);
  capInfo.innerHTML = `<div class="capitaine-label">Capitaine</div>
    <div class="capitaine-name" id="cap-${rid}">${capMember?capMember.name:'Non désigné'}</div>`;
  const capSel = document.createElement('select');
  capSel.className = 'cap-select';
  capSel.innerHTML = '<option value="">Désigner…</option>' +
    MEMBERS.map(m=>`<option value="${m.id}"${meta.capitaine===m.id?' selected':''}>${m.name}</option>`).join('');
  capSel.addEventListener('change', () => saveCapitaine(rid, capSel.value));
  capBlock.append(capInfo, capSel);
  bottom.append(btns, capBlock);
  wrap.appendChild(bottom);

  return wrap;
}

// ═══════════════════════════════════════════════════════════════
// TIMER LOGIQUE
// ═══════════════════════════════════════════════════════════════
function initTimer(rid) {
  if (!_timers[rid]) _timers[rid] = { elapsed:0, running:false, startTime:0 };
  return _timers[rid];
}
function toggleTimer(rid) { _timers[rid]?.running ? pauseTimer(rid) : startTimer(rid); }
function startTimer(rid) {
  const t = initTimer(rid);
  t.running = true;
  t.startTime = Date.now() - t.elapsed * 1000;
  const btn = document.getElementById('tbtn-'+rid);
  if (btn) btn.textContent = 'Pause';
  t.iv = setInterval(() => {
    t.elapsed = Math.min(Math.floor((Date.now()-t.startTime)/1000), TOTAL);
    updateTimerDisplay(rid);
    if (t.elapsed >= TOTAL) { clearInterval(t.iv); t.running=false; if (btn) btn.textContent='▶ Démarrer'; }
  }, 500);
}
function pauseTimer(rid) {
  const t = _timers[rid]; if (!t) return;
  clearInterval(t.iv); t.running = false;
  t.elapsed = Math.min(Math.floor((Date.now()-t.startTime)/1000), TOTAL);
  const btn = document.getElementById('tbtn-'+rid);
  if (btn) btn.textContent = 'Reprendre';
}
function resetTimer(rid) {
  const t = _timers[rid]; if (t) clearInterval(t.iv);
  _timers[rid] = { elapsed:0, running:false, startTime:0 };
  const btn = document.getElementById('tbtn-'+rid);
  if (btn) btn.textContent = '▶ Démarrer';
  updateTimerDisplay(rid);
}
function jumpToQuart(rid, qIdx) {
  // Juste surligner — ne jamais changer le temps
  updateTimerDisplay(rid, qIdx);
}
function updateTimerDisplay(rid, forcedQ) {
  const t = _timers[rid] || initTimer(rid);
  const rem = TOTAL - t.elapsed;
  const clock = document.getElementById('tclock-'+rid);
  if (!clock) return;
  const m = Math.floor(rem/60), s = rem%60;
  clock.textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  clock.className = 'timer-clock'+(rem<=300?' danger':rem<=600?' warn':'');

  // Q actif selon temps
  let autoQ = 0;
  for (let i=0;i<4;i++) { if (t.elapsed >= Q_BOUNDS[i]) autoQ = i; }
  const activeQ = (forcedQ !== undefined) ? forcedQ : autoQ;

  const QCOLS  = ['rgba(34,197,94,.5)','rgba(59,130,246,.4)','rgba(245,158,11,.35)','rgba(230,57,70,.35)'];
  const QBORDS = ['#22c55e','#3b82f6','#f59e0b','#e63946'];
  for (let i=0;i<4;i++) {
    const q  = document.getElementById('quart-'+rid+'-'+i);
    const ql = document.getElementById('ql-'+rid+'-'+i);
    const qs = document.getElementById('qs-'+rid+'-'+i);
    if (!q) continue;
    if (i===activeQ) {
      q.className='quart active'; q.style.borderColor=QBORDS[i]; q.style.background=QCOLS[i];
      if (ql) { ql.className='quart-num active'; ql.style.color=QBORDS[i]; }
      const qRem = Q_BOUNDS[i+1]-t.elapsed;
      if (qs) { qs.textContent=Math.floor(Math.max(0,qRem)/60)+"'"+String(Math.max(0,qRem)%60).padStart(2,'0')+'\"'; qs.style.color='rgba(255,255,255,.7)'; }
    } else if (i<autoQ) {
      q.className='quart done'; q.style.borderColor='#22c55e'; q.style.background='rgba(34,197,94,.1)';
      if (ql) { ql.className='quart-num done'; ql.style.color='#22c55e'; }
      if (qs) { qs.textContent='✓'; qs.style.color='#22c55e'; }
    } else {
      q.className='quart'; q.style.borderColor='transparent'; q.style.background='rgba(255,255,255,.06)';
      if (ql) { ql.className='quart-num'; ql.style.color=''; }
      if (qs) qs.textContent='';
    }
  }
  const cursor = document.getElementById('tlc-'+rid);
  if (cursor) cursor.style.left = Math.min(100,(t.elapsed/TOTAL)*100)+'%';
}

// ═══════════════════════════════════════════════════════════════
// CAPITAINE
// ═══════════════════════════════════════════════════════════════
async function saveCapitaine(rid, memberId) {
  const el = document.getElementById('cap-'+rid);
  const m = getMember(memberId);
  if (el) el.textContent = m ? m.name : 'Non désigné';
  if (!state.agendaNotes[rid]) state.agendaNotes[rid] = {};
  state.agendaNotes[rid]._capitaine = memberId;
  try { await saveMetaNotes(rid, { capitaine: memberId }); }
  catch(e) { showError(e.message); }
}

// ═══════════════════════════════════════════════════════════════
// SUJET DU JOUR
// ═══════════════════════════════════════════════════════════════
function buildSujDuJour(rid) {
  const note = getItemNote(rid, '_sdj');
  const el = document.createElement('div');
  el.className = 'sdj-block';
  el.innerHTML = '<div class="sdj-title">🎯 Sujet du jour</div>';
  const grid = document.createElement('div');
  grid.className = 'body-grid';

  // Notes col
  const notesCol = document.createElement('div');
  const notesLbl = document.createElement('div'); notesLbl.className='body-lbl'; notesLbl.textContent='💬 Notes';
  const ta = document.createElement('textarea');
  ta.className='body-ta'; ta.placeholder='Notes…'; ta.value=note.decision||'';
  ta.addEventListener('input', () => debounceNote(rid,'_sdj','decision',ta.value));
  notesCol.append(notesLbl, ta);

  // Actions col
  const actCol = document.createElement('div');
  const actLbl = document.createElement('div'); actLbl.className='body-lbl'; actLbl.textContent='🎯 Actions';
  const actList = document.createElement('div'); actList.className='actions-list'; actList.id=`al-${rid}-_sdj`;
  renderActionsList(rid, '_sdj', actList, note.actions||[]);
  const addBtn = document.createElement('button'); addBtn.className='add-action-btn'; addBtn.textContent='+ Ajouter une action';
  addBtn.addEventListener('click', () => openAaf(rid,'_sdj'));
  const aaf = buildAaf(rid,'_sdj');
  actCol.append(actLbl, actList, addBtn, aaf);

  grid.append(notesCol, actCol);
  el.appendChild(grid);
  return el;
}

// ═══════════════════════════════════════════════════════════════
// CARTE SUJET ACCORDÉON
// ═══════════════════════════════════════════════════════════════
function buildSubjectCard(r, i, subj, notes, starred, prefix) {
  const pfx = prefix ? prefix+'-' : '';
  const key = 'item_'+i;
  const note = notes[key] || {};
  const st = note.status || 'todo';
  const isStar = starred.has(i);

  const sc = document.createElement('div');
  sc.className = 'subj'+(isStar?' prio':'')+(st==='report'?' reported':'')+(st==='done'?' done-s':'');
  sc.id = 'sc-'+pfx+r.id+'-'+i;

  // Header
  const hdr = document.createElement('div'); hdr.className='subj-hdr';

  const starBtn = document.createElement('button'); starBtn.className='star-btn'+(isStar?' on':''); starBtn.textContent='★';
  starBtn.addEventListener('click', e => { e.stopPropagation(); toggleStar(r.id,i); });

  const stBtn = document.createElement('button');
  stBtn.className='status-btn '+(st==='done'?'st-done':st==='report'?'st-report':'st-todo');
  stBtn.textContent = st==='done'?'✅ Traité':st==='report'?'🔄 Reporté':'⬜ À traiter';
  stBtn.addEventListener('click', e => { e.stopPropagation(); cycleStatus(r.id,i); });

  const titleEl = document.createElement('span');
  titleEl.className='subj-title'+(st==='done'?' crossed':''); titleEl.textContent=subj;

  const chevEl = document.createElement('span'); chevEl.className='chevron'; chevEl.textContent='▼';
  chevEl.id='chev-'+pfx+r.id+'-'+i;

  hdr.append(starBtn, stBtn, titleEl, chevEl);
  hdr.addEventListener('click', () => toggleSubj(pfx+r.id+'-'+i));
  sc.appendChild(hdr);

  // Body
  const body = document.createElement('div'); body.className='subj-body'; body.id='sb-'+pfx+r.id+'-'+i;
  const grid = document.createElement('div'); grid.className='body-grid';

  // Notes
  const notesCol = document.createElement('div');
  const notesLbl = document.createElement('div'); notesLbl.className='body-lbl'; notesLbl.textContent='💬 Commentaires';
  const ta = document.createElement('textarea');
  ta.className='body-ta'; ta.placeholder='Notes…'; ta.value=note.decision||'';
  ta.addEventListener('input', () => debounceNote(r.id,i,'decision',ta.value));
  notesCol.append(notesLbl, ta);

  // Actions
  const actCol = document.createElement('div');
  const actLbl = document.createElement('div'); actLbl.className='body-lbl'; actLbl.textContent='🎯 Actions';
  const actList = document.createElement('div'); actList.className='actions-list'; actList.id=`al-${r.id}-${i}`;
  let actions = note.actions||[];
  if (!actions.length && note.action) actions=[{assignee:note.assignee||'',text:note.action}];
  renderActionsList(r.id, i, actList, actions);
  const addBtn = document.createElement('button'); addBtn.className='add-action-btn'; addBtn.textContent='+ Ajouter une action';
  addBtn.addEventListener('click', () => openAaf(r.id,i));
  const aaf = buildAaf(r.id,i);
  actCol.append(actLbl, actList, addBtn, aaf);

  grid.append(notesCol, actCol);
  body.appendChild(grid);
  sc.appendChild(body);
  return sc;
}

function toggleSubj(id) {
  const body = document.getElementById('sb-'+id);
  const chev = document.getElementById('chev-'+id);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (chev) chev.classList.toggle('open', open);
}

// ═══════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════
function renderActionsList(rid, idx, container, actions) {
  container.innerHTML = '';
  actions.forEach((ac,ai) => {
    const m = getMember(ac.assignee);
    const row = document.createElement('div'); row.className='action-row';
    const av = document.createElement('div'); av.className='action-av';
    av.style.background = m?m.color:'#94a3b8'; av.textContent=m?m.name.substring(0,2):'?';
    const txt = document.createElement('span'); txt.className='action-txt';
    txt.innerHTML=(m?`<strong>${m.name}</strong> : `:'')+ac.text;
    const del = document.createElement('button'); del.className='action-del'; del.textContent='×';
    del.addEventListener('click', () => removeAction(rid,idx,ai));
    row.append(av,txt,del);
    container.appendChild(row);
  });
}
function buildAaf(rid, idx) {
  const aaf = document.createElement('div');
  aaf.className='aaf'; aaf.id=`aaf-${rid}-${idx}`;
  const sel = document.createElement('select'); sel.id=`aaf-sel-${rid}-${idx}`;
  sel.innerHTML='<option value="">Assigner à…</option>'+MEMBERS.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
  const ta = document.createElement('textarea'); ta.id=`aaf-txt-${rid}-${idx}`; ta.placeholder="Décrivez l'action…";
  const btns = document.createElement('div'); btns.className='aaf-btns';
  const save = document.createElement('button'); save.className='aaf-save'; save.textContent='Enregistrer';
  save.addEventListener('click', () => confirmAction(rid,idx));
  const cancel = document.createElement('button'); cancel.className='aaf-cancel'; cancel.textContent='Annuler';
  cancel.addEventListener('click', () => closeAaf(rid,idx));
  btns.append(save,cancel);
  aaf.append(sel,ta,btns);
  return aaf;
}
function openAaf(rid,idx) {
  const aaf = document.getElementById(`aaf-${rid}-${idx}`);
  if (aaf) aaf.classList.toggle('open');
}
function closeAaf(rid,idx) {
  const aaf = document.getElementById(`aaf-${rid}-${idx}`);
  if (aaf) { aaf.classList.remove('open'); const t=document.getElementById(`aaf-txt-${rid}-${idx}`); if(t) t.value=''; }
}
async function confirmAction(rid,idx) {
  const sel=document.getElementById(`aaf-sel-${rid}-${idx}`);
  const ta=document.getElementById(`aaf-txt-${rid}-${idx}`);
  if (!ta||!ta.value.trim()) return;
  const note = getItemNote(rid,idx);
  let actions = [...(note.actions||[])];
  if (!actions.length && note.action) actions=[{assignee:note.assignee||'',text:note.action}];
  actions.push({assignee:sel?sel.value:'', text:ta.value.trim()});
  try {
    await saveItemNote(rid,idx,{actions});
    closeAaf(rid,idx);
    const container=document.getElementById(`al-${rid}-${idx}`);
    if(container) renderActionsList(rid,idx,container,actions);
  } catch(e) { showError(e.message); }
}
async function removeAction(rid,idx,ai) {
  const note=getItemNote(rid,idx);
  let actions=[...(note.actions||[])];
  if(!actions.length&&note.action) actions=[{assignee:note.assignee||'',text:note.action}];
  actions.splice(ai,1);
  try {
    await saveItemNote(rid,idx,{actions});
    const container=document.getElementById(`al-${rid}-${idx}`);
    if(container) renderActionsList(rid,idx,container,actions);
  } catch(e) { showError(e.message); }
}

// ═══════════════════════════════════════════════════════════════
// NOTES & DEBOUNCE
// ═══════════════════════════════════════════════════════════════
function debounceNote(rid,idx,field,value) {
  const k=`${rid}_${idx}_${field}`;
  clearTimeout(_saveTimers[k]);
  _saveTimers[k]=setTimeout(async()=>{
    try { await saveItemNote(rid,idx,{[field]:value}); }
    catch(e) { showError(e.message); }
  },1500);
}

// ═══════════════════════════════════════════════════════════════
// ÉTOILE & STATUT
// ═══════════════════════════════════════════════════════════════
async function toggleStar(rid,idx) {
  const meta=getMetaNotes(rid);
  const starred=new Set(meta.starred);
  starred.has(idx)?starred.delete(idx):starred.add(idx);
  try {
    await saveMetaNotes(rid,{_starred:Array.from(starred)});
    renderHome();
  } catch(e) { showError(e.message); }
}
async function cycleStatus(rid,idx) {
  const note=getItemNote(rid,idx);
  const cur=note.status||'todo';
  const next=cur==='todo'?'done':cur==='done'?'report':'todo';
  try {
    await saveItemNote(rid,idx,{status:next});
    // Mise à jour visuelle directe
    ['','p-'].forEach(pfx=>{
      const sc=document.getElementById(`sc-${pfx}${rid}-${idx}`);
      if(!sc) return;
      sc.className='subj'+(getMetaNotes(rid).starred.includes(idx)?' prio':'')+(next==='report'?' reported':'')+(next==='done'?' done-s':'');
      const stBtn=sc.querySelector('.status-btn');
      if(stBtn) { stBtn.className='status-btn '+(next==='done'?'st-done':next==='report'?'st-report':'st-todo'); stBtn.textContent=next==='done'?'✅ Traité':next==='report'?'🔄 Reporté':'⬜ À traiter'; }
      const titleEl=sc.querySelector('.subj-title');
      if(titleEl) titleEl.classList.toggle('crossed',next==='done');
    });
  } catch(e) { showError(e.message); }
}

function buildCRSection(r, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'cr-wrap';

  // Checklist Paul
  wrap.appendChild(buildChecklist(r.id,'paul','⚡ À valider par Paul','cl-paul'));
  // Checklist Olivier
  wrap.appendChild(buildChecklist(r.id,'olivier','👁️ À voir avec Olivier Deruwez','cl-olivier'));

  // Export membres
  const expSec = document.createElement('div'); expSec.className='export-section';
  const expLbl = document.createElement('div'); expLbl.className='export-label'; expLbl.textContent='📋 Export tâches par personne';
  const expBtns = document.createElement('div'); expBtns.className='export-btns';
  MEMBERS.forEach(m=>{
    const btn=document.createElement('button'); btn.className='export-member';
    btn.style.borderColor=m.color; btn.textContent=m.name;
    btn.addEventListener('click',()=>exportMember(r.id,m.id));
    expBtns.appendChild(btn);
  });
  expSec.append(expLbl,expBtns);
  wrap.appendChild(expSec);

  // CR rapide
  const crBtns=document.createElement('div'); crBtns.className='cr-export-btns';
  const crBtn=document.createElement('button'); crBtn.className='cr-btn cr-btn-quick'; crBtn.textContent='📤 CR rapide (WhatsApp)';
  crBtn.addEventListener('click',()=>toggleCR(r.id));
  crBtns.appendChild(crBtn);
  wrap.appendChild(crBtns);

  const crResult=document.createElement('div'); crResult.className='cr-result'; crResult.id='cr-box-'+r.id;
  const crText=document.createElement('div'); crText.className='cr-text'; crText.id='cr-txt-'+r.id;
  const crCopy=document.createElement('button'); crCopy.className='cr-copy-btn'; crCopy.textContent='📋 Copier';
  crCopy.addEventListener('click',()=>copyCR(r.id));
  const crPrint=document.createElement('button'); crPrint.className='cr-copy-btn'; crPrint.style.cssText='background:#3b82f6;margin-left:8px'; crPrint.textContent='🖨️ Imprimer';
  crPrint.addEventListener('click',()=>window.print());
  crResult.append(crText,crCopy,crPrint);
  wrap.appendChild(crResult);

  return wrap;
}

function buildChecklist(rid,who,title,cls) {
  const block=document.createElement('div'); block.className=`cl-block ${cls}`;
  const hdr=document.createElement('div'); hdr.className='cl-hdr';
  const ttl=document.createElement('span'); ttl.className='cl-title'; ttl.textContent=title;
  const copy=document.createElement('button'); copy.className='cl-copy'; copy.textContent='📋 Copier';
  copy.addEventListener('click',()=>copyChecklist(rid,who));
  hdr.append(ttl,copy);
  const items=document.createElement('div'); items.className='cl-items'; items.id=`cl-${who}-${rid}`;
  renderChecklist(rid,who,items);
  const addRow=document.createElement('div'); addRow.className='cl-add';
  const inp=document.createElement('input'); inp.id=`cl-inp-${who}-${rid}`; inp.placeholder='Ajouter un sujet…';
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') addChecklistItem(rid,who); });
  const addBtn=document.createElement('button'); addBtn.className='cl-add-btn'; addBtn.textContent='+';
  addBtn.addEventListener('click',()=>addChecklistItem(rid,who));
  addRow.append(inp,addBtn);
  block.append(hdr,items,addRow);
  return block;
}
function renderChecklist(rid,who,container) {
  if (!container) container=document.getElementById(`cl-${who}-${rid}`);
  if (!container) return;
  const meta=getMetaNotes(rid);
  const items=who==='paul'?(meta.cl_paul||[]):(meta.cl_olivier||[]);
  container.innerHTML=items.map((item,i)=>`
    <div class="cl-item">
      <input type="checkbox"${item.done?' checked':''} onchange="toggleClItem('${rid}','${who}',${i},this.checked)">
      <span style="${item.done?'text-decoration:line-through;opacity:.5':''}">${item.text}</span>
      <button class="cl-item-del" onclick="removeClItem('${rid}','${who}',${i})">×</button>
    </div>`).join('');
}
async function addChecklistItem(rid,who) {
  const inp=document.getElementById(`cl-inp-${who}-${rid}`);
  if(!inp||!inp.value.trim()) return;
  const meta=getMetaNotes(rid);
  const prop=who==='paul'?'cl_paul':'cl_olivier';
  const items=[...(meta[prop]||[]),{text:inp.value.trim(),done:false}];
  inp.value='';
  try { await saveMetaNotes(rid,{[prop]:items}); renderChecklist(rid,who); }
  catch(e){ showError(e.message); }
}
async function toggleClItem(rid,who,idx,done) {
  const meta=getMetaNotes(rid);
  const prop=who==='paul'?'cl_paul':'cl_olivier';
  const items=[...(meta[prop]||[])];
  if(items[idx]) items[idx].done=done;
  try { await saveMetaNotes(rid,{[prop]:items}); renderChecklist(rid,who); }
  catch(e){ showError(e.message); }
}
async function removeClItem(rid,who,idx) {
  const meta=getMetaNotes(rid);
  const prop=who==='paul'?'cl_paul':'cl_olivier';
  const items=[...(meta[prop]||[])];
  items.splice(idx,1);
  try { await saveMetaNotes(rid,{[prop]:items}); renderChecklist(rid,who); }
  catch(e){ showError(e.message); }
}
function copyChecklist(rid,who) {
  const meta=getMetaNotes(rid);
  const items=who==='paul'?(meta.cl_paul||[]):(meta.cl_olivier||[]);
  if(!items.length){alert('Liste vide');return;}
  const r=state.reunions.find(x=>x.id===rid);
  const dt=r&&r.date?new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
  const name=who==='paul'?'Paul':'Olivier Deruwez';
  navigator.clipboard.writeText(`SUJETS POUR ${name.toUpperCase()} — ${dt}\n\n${items.map(it=>(it.done?'[x]':'[ ]')+' '+it.text).join('\n')}`);
  showSaveOk();
}

// ═══════════════════════════════════════════════════════════════
// CR EXPORT
// ═══════════════════════════════════════════════════════════════
function toggleCR(rid) {
  const box=document.getElementById('cr-box-'+rid);
  if(!box) return;
  const open=box.classList.toggle('open');
  if(!open) return;
  const r=state.reunions.find(x=>x.id===rid);
  if(!r) return;
  const notes=getReunionNotes(rid);
  const meta=getMetaNotes(rid);
  const themes=getThemes();
  let themeMap={};
  try{themeMap=r.agendaThemes?JSON.parse(r.agendaThemes):{};}catch(e){}
  const dt=r.date?new Date(r.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
  const cap=getMember(meta.capitaine);
  const lines=[`CR ${r.title.toUpperCase()} — ${dt}`+(cap?` | Capitaine : ${cap.name}`:''),''];
  const byTheme={};
  themes.forEach(t=>{byTheme[t.id]={label:t.label,notes:[],actions:[]};});
  byTheme['_autre']={label:'Autre',notes:[],actions:[]};
  (r.agenda||[]).forEach((subj,i)=>{
    const tid=themeMap[i];
    const bucket=tid&&byTheme[tid]?tid:'_autre';
    const n=notes['item_'+i]||{};
    if(n.decision) byTheme[bucket].notes.push(`${subj} : ${n.decision}`);
    const acts=n.actions||(n.action?[{assignee:n.assignee||'',text:n.action}]:[]);
    acts.forEach(ac=>{const m=getMember(ac.assignee);byTheme[bucket].actions.push(`${m?m.name+' : ':''}${ac.text} (${subj})`);});
  });
  themes.forEach(t=>{
    const b=byTheme[t.id];
    if(!b||(!b.notes.length&&!b.actions.length)) return;
    lines.push(`[ ${t.label} ]`);
    b.notes.forEach(n=>lines.push(`  Note : ${n}`));
    b.actions.forEach(a=>lines.push(`  Action : ${a}`));
    lines.push('');
  });
  const el=document.getElementById('cr-txt-'+rid);
  if(el) el.textContent=lines.join('\n');
}
function copyCR(rid) {
  const el=document.getElementById('cr-txt-'+rid);
  if(el) navigator.clipboard.writeText(el.textContent).then(()=>showSaveOk());
}
function exportMember(rid,memberId) {
  const r=state.reunions.find(x=>x.id===rid);
  if(!r) return;
  const notes=getReunionNotes(rid);
  const themes=getThemes();
  let themeMap={};
  try{themeMap=r.agendaThemes?JSON.parse(r.agendaThemes):{};}catch(e){}
  const m=getMember(memberId);
  const dt=r.date?new Date(r.date).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
  const actions=[];
  (r.agenda||[]).forEach((subj,i)=>{
    const n=notes['item_'+i]||{};
    const acts=n.actions||(n.action&&n.assignee===memberId?[{assignee:memberId,text:n.action}]:[]);
    acts.filter(a=>a.assignee===memberId&&a.text).forEach(a=>{
      const t=themes.find(x=>x.id===themeMap[i])||{label:'Autre'};
      actions.push(`[${t.label}] ${subj} : ${a.text}`);
    });
  });
  if(!actions.length){alert(`Aucune action assignée à ${m?m.name:memberId}`);return;}
  navigator.clipboard.writeText(`TÂCHES DE ${(m?m.name:memberId).toUpperCase()} — ${dt}\n\n${actions.map(a=>'- '+a).join('\n')}`).then(()=>showSaveOk());
}

// ═══════════════════════════════════════════════════════════════
// ARCHIVES
// ═══════════════════════════════════════════════════════════════
function renderArchives() {
  const el=document.getElementById('archivesList');
  const now=new Date(); now.setHours(0,0,0,0);
  const past=state.reunions
    .filter(r=>!r.date||new Date(r.date)<now)
    .sort((a,b)=>{
      if(!a.date&&!b.date) return 0;
      if(!a.date) return 1; if(!b.date) return -1;
      return new Date(b.date)-new Date(a.date);
    });
  if(!past.length){
    el.innerHTML='<div class="no-data"><div class="no-data-icon">🗂️</div><div class="no-data-title">Aucune réunion archivée</div></div>';
    return;
  }
  const themes=getThemes();
  el.innerHTML=past.map(r=>{
    const dt=r.date?new Date(r.date):null;
    let themeMap={};
    try{themeMap=r.agendaThemes?JSON.parse(r.agendaThemes):{};}catch(e){}
    const usedIds=[...new Set(Object.values(themeMap))];
    const tags=usedIds.map(tid=>{
      const t=themes.find(x=>x.id===tid);
      return t?`<span class="arc-tag" style="background:${t.bg};color:${t.color}">${t.label}</span>`:'';
    }).filter(Boolean).slice(0,4).join('');
    const meta=getMetaNotes(r.id);
    const cap=getMember(meta.capitaine);
    const nb=(r.agenda||[]).length;
    return `<div class="arc-item" onclick="openArchive('${r.id}')">
      <div class="arc-badge">
        <div class="arc-day">${dt?dt.getDate():'?'}</div>
        <div class="arc-month">${dt?dt.toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}):'—'}</div>
      </div>
      <div class="arc-info">
        <div class="arc-title">${r.title}</div>
        <div class="arc-meta">${r.time?'🕐 '+cleanTime(r.time)+' · ':''}${cap?'👤 '+cap.name+' · ':''}${nb} sujet${nb>1?'s':''}</div>
        ${tags?`<div class="arc-tags">${tags}</div>`:''}
      </div>
      <div style="color:var(--muted);font-size:20px;flex-shrink:0">›</div>
    </div>`;
  }).join('');
}

function openArchive(rid) {
  const r=state.reunions.find(x=>x.id===rid);
  if(!r) return;
  const el=document.getElementById('archivesList');
  el.innerHTML='<button class="btn btn-ghost btn-sm" onclick="renderArchives()" style="margin-bottom:16px">← Retour aux archives</button>';

  // Vue lecture seule
  const notes=getReunionNotes(rid);
  const meta=getMetaNotes(rid);
  const themes=getThemes();
  let themeMap={};
  try{themeMap=r.agendaThemes?JSON.parse(r.agendaThemes):{};}catch(e){}
  const dt=r.date?new Date(r.date):null;
  const cap=getMember(meta.capitaine);

  const detail=document.createElement('div');
  detail.className='arc-detail';
  detail.innerHTML=`
    <div class="arc-detail-hdr">
      <div>
        <div class="arc-detail-title">${r.title}</div>
        <div class="arc-detail-meta">${dt?dt.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Sans date'}${r.time?' · 🕐 '+cleanTime(r.time):''}${r.location?' · 📍 '+r.location:''}${cap?' · 👤 '+cap.name:''}</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Imprimer</button>
    </div>`;

  // Sujets groupés par thème
  const grouped={};
  themes.forEach(t=>{grouped[t.id]=[];});
  grouped['_autre']=[];
  (r.agenda||[]).forEach((subj,i)=>{
    const tid=themeMap[i];
    const bucket=tid&&grouped[tid]!==undefined?tid:'_autre';
    grouped[bucket].push({subj,i});
  });

  [...themes,{id:'_autre',label:'Autre',color:'#6366f1',bg:'#eef2ff'}].forEach(t=>{
    const items=grouped[t.id]||[];
    if(!items.length) return;
    const sec=document.createElement('div'); sec.className='arc-section';
    sec.innerHTML=`<div class="arc-section-title" style="color:${t.color}">${t.label}</div>`;
    items.forEach(({subj,i})=>{
      const n=notes['item_'+i]||{};
      const st=n.status||'todo';
      const acts=n.actions||(n.action?[{assignee:n.assignee||'',text:n.action}]:[]);
      const subjDiv=document.createElement('div');
      subjDiv.className='arc-subj'+(st==='done'?' done-s':st==='report'?' reported':'');
      subjDiv.innerHTML=`<div class="arc-subj-title">
        <span>${st==='done'?'✅':st==='report'?'🔄':'⬜'}</span>
        <span>${subj}</span>
      </div>
      ${n.decision?`<div class="arc-subj-note">💬 ${n.decision}</div>`:''}`;
      if(acts.length){
        const actDiv=document.createElement('div'); actDiv.className='arc-subj-actions';
        acts.forEach(ac=>{
          const m=getMember(ac.assignee);
          const row=document.createElement('div'); row.className='arc-action';
          if(m){const av=document.createElement('div');av.className='arc-av';av.style.background=m.color;av.textContent=m.name.substring(0,2);row.appendChild(av);}
          const txt=document.createElement('span');txt.textContent=(m?m.name+' : ':'')+ac.text;
          row.appendChild(txt); actDiv.appendChild(row);
        });
        subjDiv.appendChild(actDiv);
      }
      sec.appendChild(subjDiv);
    });
    detail.appendChild(sec);
  });

  // Checklists résumé
  if((meta.cl_paul||[]).length||(meta.cl_olivier||[]).length){
    const clSec=document.createElement('div'); clSec.className='arc-section';
    clSec.innerHTML='<div class="arc-section-title">Checklists</div>';
    if((meta.cl_paul||[]).length){
      clSec.innerHTML+=`<div style="margin-bottom:8px"><strong style="font-size:12px;color:#dc2626">⚡ Paul</strong><br>${meta.cl_paul.map(it=>`<div style="font-size:12px;padding:3px 0">${it.done?'✅':'⬜'} ${it.text}</div>`).join('')}</div>`;
    }
    if((meta.cl_olivier||[]).length){
      clSec.innerHTML+=`<div><strong style="font-size:12px;color:#0369a1">👁️ Olivier</strong><br>${meta.cl_olivier.map(it=>`<div style="font-size:12px;padding:3px 0">${it.done?'✅':'⬜'} ${it.text}</div>`).join('')}</div>`;
    }
    detail.appendChild(clSec);
  }

  el.appendChild(detail);
}

function renderMatch() {
  const el=document.getElementById('matchContent');
  if(!el) return;
  const m=state.match||{};
  el.innerHTML=`<div class="match-card">
    <div style="font-size:18px;font-weight:800;margin-bottom:4px">🏟️ Match du mois</div>
    <div style="font-size:13px;opacity:.7">Suivez vos progrès collectifs</div>
    <div class="match-grid">
      ${[['axe',"🎯 Axe prioritaire"],['binome',"👥 Équipe / Binôme"],['livrable',"📦 Livrable"],['plan',"📅 Plan d'action"]].map(([k,title])=>`
        <div class="match-block">
          <div class="match-block-title">${title}</div>
          <textarea placeholder="${title}…" oninput="saveMatch('${k}',this.value)">${m[k]||''}</textarea>
        </div>`).join('')}
    </div>
  </div>`;
}
let _matchTimer;
function saveMatch(field,value) {
  state.match[field]=value;
  clearTimeout(_matchTimer);
  _matchTimer=setTimeout(()=>localStorage.setItem('hdf_match',JSON.stringify(state.match)),800);
}

// ═══════════════════════════════════════════════════════════════
// MODAL RÉUNION
// ═══════════════════════════════════════════════════════════════
function openModal(type, data) {
  if(type==='reunion'){
    _editId=data?data.id:null;
    document.getElementById('modal-reunion-title').textContent=_editId?'Modifier la réunion':'Nouvelle réunion';
    document.getElementById('modal-reunion-body').innerHTML=buildReunionForm(data);
    document.getElementById('modal-reunion').classList.add('open');
  } else if(type==='themes'){
    renderThemesModal();
    document.getElementById('modal-themes').classList.add('open');
  }
}
function closeModal(type) {
  document.getElementById('modal-'+type).classList.remove('open');
}
function editReunion(id) {
  const r=state.reunions.find(x=>x.id===id);
  if(r) openModal('reunion',r);
}
async function deleteReunion(id) {
  if(!confirm('Supprimer cette réunion ?')) return;
  try {
    await apiCall('deleteReunion',{id});
    state.reunions=state.reunions.filter(r=>r.id!==id);
    delete state.agendaNotes[id];
    renderHome();
  } catch(e){ showError(e.message); }
}

// Form réunion
let _agendaCount = 0;
function buildReunionForm(data) {
  _agendaItems = [];
  let themeMap={};
  try{themeMap=data?.agendaThemes?JSON.parse(data.agendaThemes):{};}catch(e){}
  (data?.agenda||[]).forEach((txt,i)=>{
    _agendaItems.push({txt,theme:themeMap[i]||'autre'});
  });
  return `
    <div class="form-group"><label class="form-label">Titre *</label>
      <input class="form-input" id="f-title" value="${data?.title||''}" placeholder="Réunion équipe IRFBB">
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Date</label>
        <input class="form-input" id="f-date" type="date" value="${data?.date||''}">
      </div>
      <div class="form-group"><label class="form-label">Heure</label>
        <input class="form-input" id="f-time" type="time" value="${data?.time||''}">
      </div>
    </div>
    <div class="form-group"><label class="form-label">Lieu</label>
      <input class="form-input" id="f-location" value="${data?.location||''}" placeholder="Bureau IRFBB">
    </div>
    <div class="form-group">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <label class="form-label" style="margin:0">Ordre du jour</label>
        <button class="btn btn-ghost btn-sm" type="button" onclick="openModal('themes')">⚙️ Thématiques</button>
      </div>
      <div id="agenda-builder">${renderAgendaItems()}</div>
      <div class="ab-add-row" id="ab-add-row">${renderAddBtns()}</div>
    </div>`;
}
function renderAgendaItems() {
  return _agendaItems.map((item,i)=>{
    const t=getTheme(item.theme);
    return `<div class="ab-item" id="abi-${i}">
      <select class="ab-sel" style="color:${t.color}" onchange="changeTheme(${i},this.value)">
        ${getThemes().map(th=>`<option value="${th.id}"${item.theme===th.id?' selected':''}>${th.label}</option>`).join('')}
      </select>
      <input class="ab-inp" value="${item.txt}" placeholder="Sujet…" oninput="_agendaItems[${i}].txt=this.value">
      <button class="ab-del" type="button" onclick="removeAgendaItem(${i})">×</button>
    </div>`;
  }).join('');
}
function renderAddBtns() {
  return getThemes().map(t=>`<button class="ab-add-btn" type="button" style="border-color:${t.color};color:${t.color}" onclick="addAgendaItem('${t.id}')">+ ${t.label}</button>`).join('')+
    `<button class="ab-add-btn" type="button" style="border-color:#94a3b8;color:#64748b" onclick="openModal('themes')">⚙️ Gérer</button>`;
}
function addAgendaItem(theme) {
  _agendaItems.push({txt:'',theme:theme||'autre'});
  refreshBuilder();
}
function removeAgendaItem(i) {
  _agendaItems.splice(i,1);
  refreshBuilder();
}
function changeTheme(i,theme) {
  _agendaItems[i].theme=theme;
  refreshBuilder();
}
function refreshBuilder() {
  const b=document.getElementById('agenda-builder');
  const r=document.getElementById('ab-add-row');
  if(b) b.innerHTML=renderAgendaItems();
  if(r) r.innerHTML=renderAddBtns();
}
async function saveReunion() {
  const title=(document.getElementById('f-title')||{}).value?.trim();
  if(!title){alert('Le titre est requis');return;}
  const date=(document.getElementById('f-date')||{}).value||'';
  const time=(document.getElementById('f-time')||{}).value||'';
  const location=(document.getElementById('f-location')||{}).value?.trim()||'';
  const agenda=_agendaItems.filter(x=>x.txt.trim()).map(x=>x.txt.trim());
  const themeMap={};
  _agendaItems.filter(x=>x.txt.trim()).forEach((x,i)=>{themeMap[i]=x.theme;});
  const existing=_editId?state.reunions.find(r=>r.id===_editId):null;
  const id=_editId||genId();
  const d={id,title,date,time,location,agenda,agendaThemes:JSON.stringify(themeMap),decisions:existing?.decisions||'',actions:existing?.actions||'',nextMeeting:existing?.nextMeeting||'',paulValidation:existing?.paulValidation||''};

  showLoading(true);
  try {
    await apiCall('saveReunion',{data:d});
    if(_editId){
      const idx=state.reunions.findIndex(r=>r.id===_editId);
      if(idx>=0) state.reunions[idx]=d; else state.reunions.push(d);
    } else {
      state.reunions.push(d);
      // Injecter sujets reportés
      await injectReported(id,d,date);
    }
    closeModal('reunion');
    renderHome();
  } catch(e){showError(e.message);}
  finally{showLoading(false);}
}
async function injectReported(newId,newR,newDate) {
  if(!newDate) return;
  const now=new Date(newDate);
  const prev=state.reunions
    .filter(r=>r.id!==newId&&r.date&&new Date(r.date)<now)
    .sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  if(!prev) return;
  const prevNotes=state.agendaNotes[prev.id]||{};
  const reported=(prev.agenda||[])
    .map((subj,i)=>({subj,i,note:prevNotes['item_'+i]||{}}))
    .filter(x=>x.note.status==='report');
  if(!reported.length) return;
  for(const {subj,note} of reported){
    const idx=newR.agenda.length;
    newR.agenda.push(subj);
    const tm=newR.agendaThemes?JSON.parse(newR.agendaThemes):{};
    tm[idx]='autre';
    newR.agendaThemes=JSON.stringify(tm);
    await apiCall('saveAgendaNote',{reunionId:newId,key:'item_'+idx,data:{decision:'🔄 Reporté depuis la réunion précédente',actions:note.actions||[],status:'todo'}});
  }
  await apiCall('saveReunion',{data:newR});
}

// GESTION THÉMATIQUES
// ═══════════════════════════════════════════════════════════════
function renderThemesModal() {
  const body=document.getElementById('modal-themes-body');
  const custom=state.customThemes||[];
  body.innerHTML=`
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Les thématiques fixes ne peuvent pas être modifiées. Vous pouvez ajouter, modifier ou supprimer des thématiques personnalisées.</p>
    <div style="margin-bottom:16px">
      <div class="form-label">Thématiques fixes</div>
      <div class="themes-list">${FIXED_THEMES.map(t=>`<span class="theme-chip" style="background:${t.bg};color:${t.color}">${t.label}</span>`).join('')}</div>
    </div>
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="form-label">Thématiques personnalisées</div>
        <button class="btn btn-primary btn-sm" onclick="addCustomTheme()">+ Ajouter</button>
      </div>
      <div id="custom-themes-list">${renderCustomThemes()}</div>
    </div>`;
}
function renderCustomThemes() {
  return (state.customThemes||[]).map((t,i)=>`
    <div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface);border-radius:8px;margin-bottom:5px">
      <span class="theme-chip" style="background:${t.bg};color:${t.color};flex:1">${t.label}</span>
      <button class="btn btn-ghost btn-sm" onclick="editCustomTheme(${i})">✏️</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCustomTheme(${i})">×</button>
    </div>`).join('') || '<div style="color:var(--muted);font-size:13px">Aucune thématique personnalisée</div>';
}
function addCustomTheme() {
  const name=prompt('Nom de la thématique :');
  if(!name||!name.trim()) return;
  const pal=[{c:'#059669',bg:'#ecfdf5'},{c:'#7c3aed',bg:'#f5f3ff'},{c:'#b45309',bg:'#fffbeb'},{c:'#0e7490',bg:'#ecfeff'},{c:'#be185d',bg:'#fdf2f8'}];
  const p=pal[(state.customThemes||[]).length%pal.length];
  if(!state.customThemes) state.customThemes=[];
  state.customThemes.push({id:'ct_'+Date.now(),label:name.trim(),color:p.c,bg:p.bg});
  saveCustomThemes();
  renderThemesModal();
}
function editCustomTheme(i) {
  const t=state.customThemes[i];
  const name=prompt('Nouveau nom :',t.label);
  if(!name||!name.trim()) return;
  state.customThemes[i].label=name.trim();
  saveCustomThemes();
  renderThemesModal();
}
function deleteCustomTheme(i) {
  if(!confirm('Supprimer cette thématique ?')) return;
  state.customThemes.splice(i,1);
  saveCustomThemes();
  renderThemesModal();
}

setInterval(async()=>{
  if(state.loading) return;
  const active=document.activeElement;
  if(active&&(active.tagName==='TEXTAREA'||active.tagName==='INPUT')) return;
  await loadData();
  const tab=document.querySelector('.tab.active');
  if(tab?.id==='tab-home') renderHome();
  else if(tab?.id==='tab-archives') renderArchives();
},60000);
